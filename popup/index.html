<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cookie Away</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top">
        <div class="brand">
            <img src="../icons/icon48.png" alt="" width="22" height="22">
            <span>Cookie Away</span>
        </div>
        <label class="switch" title="Turn Cookie Away on or off everywhere">
            <input type="checkbox" id="master-toggle" aria-label="Cookie Away on or off">
            <span class="track"></span>
        </label>
    </header>

    <main>
        <!-- This site -->
        <section class="site" id="site" data-state="idle">
            <div class="site-head">
                <div class="site-avatar" id="site-avatar" aria-hidden="true"></div>
                <div class="site-id">
                    <div class="site-host" id="site-host">—</div>
                    <div class="site-cmp" id="site-cmp"></div>
                </div>
            </div>

            <div class="status">
                <span class="status-dot" aria-hidden="true"></span>
                <div>
                    <div class="status-title" id="status-title">Checking…</div>
                    <div class="status-detail" id="status-detail"></div>
                </div>
            </div>

            <div class="site-actions" id="site-actions">
                <button class="btn" id="retry-btn" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" /><path d="M3 21v-5h5" /></svg>
                    <span>Try again</span>
                </button>
                <button class="btn btn-quiet" id="site-toggle-btn" type="button">Turn off here</button>
            </div>
        </section>

        <!-- Behaviour -->
        <section class="group">
            <h2>When there's no reject button</h2>

            <label class="row">
                <div class="row-text">
                    <span class="row-title">Go through the settings</span>
                    <span class="row-desc">Open "Manage options", switch everything off, save</span>
                </div>
                <span class="switch small">
                    <input type="checkbox" id="deep-toggle">
                    <span class="track"></span>
                </span>
            </label>

            <div class="row">
                <div class="row-text">
                    <span class="row-title">If that doesn't work</span>
                </div>
                <div class="segmented" role="radiogroup" aria-label="If that doesn't work">
                    <label><input type="radio" name="fallback" value="leave"><span>Leave it</span></label>
                    <label><input type="radio" name="fallback" value="accept"><span>Accept</span></label>
                </div>
            </div>

            <button class="row row-link" id="jev-row" type="button">
                <div class="row-text">
                    <span class="row-title">Smart detection</span>
                    <span class="row-desc">Jev reads banners in unfamiliar languages</span>
                </div>
                <span class="pill" id="jev-pill">Off</span>
                <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
            </button>
        </section>
    </main>

    <footer class="bottom">
        <span id="stats">—</span>
        <button class="link" id="open-settings" type="button">Settings</button>
    </footer>

    <script src="script.js"></script>
</body>

</html>
